    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#ff2d3f" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>
    <clipPath id="headClip">
      <path d="M160 46c-45 0-66 34-66 84 0 36 13 58 28 77l7 29c2 19 15 31 31 31s29-12 31-31l7-29c15-19 28-41 28-77 0-50-21-84-66-84z"/>
    </clipPath>
  </defs>

  <rect width="320" height="380" fill="#120609"/>
  <rect width="320" height="380" fill="url(#grid)"/>

  <!-- targeting marks -->
  <g stroke="#ff2d3f" stroke-opacity="0.45" fill="none" stroke-width="1">
    <path d="M16 16h30M16 16v30M304 16h-30M304 16v30M16 364h30M16 364v-30M304 364h-30M304 364v-30"/>
    <circle cx="160" cy="150" r="118" stroke-dasharray="4 10" stroke-opacity="0.25"/>
    <path d="M160 12v22M160 266v22M22 150h22M276 150h22"/>

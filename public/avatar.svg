<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" role="img" aria-label="Stylized operative portrait">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a0d16"/>
      <stop offset="1" stop-color="#14060a"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2d3f" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff2d3f" stop-opacity="0.05"/>
